name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash  # Git Bash on Windows, so every step is the same script

    steps:
      - uses: actions/checkout@v4

      # dlib needs cmake + a compiler, PyAudio needs portaudio. Windows runners
      # already ship cmake and MSVC, and PyAudio has Windows wheels.
      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential portaudio19-dev libgl1 libglib2.0-0 espeak-ng

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install cmake portaudio

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      # Real keys are gitignored; tests never call the APIs
      - name: Stub sensitive config
        run: echo "{}" > src/config/configSensitive.yaml

      - name: Run tests
        run: pytest Testing/testingSequence.py Testing/test_units.py --junitxml=test-results.xml --disable-warnings -q -rs

      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.os }}
          path: test-results.xml
