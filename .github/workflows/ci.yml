name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          # cmake/build-essential: dlib, portaudio: PyAudio, libgl/glib: opencv, espeak-ng: pyttsx3
          sudo apt-get install -y cmake build-essential portaudio19-dev libgl1 libglib2.0-0 espeak-ng

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt pytest

      # Real keys are gitignored; tests never call the APIs
      - name: Stub sensitive config
        run: echo "{}" > src/config/configSensitive.yaml

      - name: Run tests
        run: pytest Testing/testingSequence.py Testing/test_units.py --junitxml=test-results.xml --disable-warnings -q

      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: test-results.xml
