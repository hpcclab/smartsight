logging:
  file_enabled: true
  # Each run creates logs/{name}_{description}_{YYYY-MM-DD_HH-MM-SS}/
  # with smartsight.log and a copy of the effective config.
  name: smartsight
  description: active session

ollama_llm:
  ollama_llm_enabled: True
  model: "gemma3:4b"
  timeout: 30

yolo_vision:
  yolo_vision_enabled: True
  model_path: "models/yolov8s.pt"
  min_conf: 0.7
  logging_enabled: False

openrouter_api:
  model_priority:
    - "qwen/qwen3-vl-8b-thinking"
    # - "openai/gpt-5.6-luna"
    # - "nvidia/nemotron-3-nano-omni-30b-a3b-reasoning:free"
    # - "dots-studio/dots-3-note-preview:free"
    # - "nex-agi/nex-n2.5-mini:free"
    # - "google/gemma-4-31b-it:free"

face_recognition:
  face_recognition_enabled: True
  encodings_path: "models/facial_recognition/encodings.pickle"
  cascade_path: "models/facial_recognition/haarcascade_frontalface_default.xml"
  tolerance: 0.5

piper_tts:
  model_path: "models/piper/en_US-lessac-low.onnx"
  config_path: "models/piper/en_US-lessac-low.onnx.json"
  use_cuda: False
  sample_rate: 16000
  temp_path: "temp/piper"
  # Paper normal rate (characters/second). Testing/benchmark_piper_speed.py --write replaces this.
  chars_per_second: 15

fusion:
  enabled: true
  # The local leg runs when ollama_llm.ollama_llm_enabled is true.
  # Paper reported first-phrase estimate. Testing/benchmark_merge_latency.py --write replaces this
  # with the local 90th percentile.
  merge_first_phrase_p90_s: 0.5

passive_detection:
  passive_detection_enabled: True
  detection_cooldown: 5 # number of seconds since last detection that object can be announced again
  object_detection_max_rate: 1.0
  facial_recognition_max_rate: 1.0
  text_detection_max_rate: 1.0

recording:
  sample_rate: 16000
  channels: 1
  chunk_size: 1024

speech_to_text:
  model_size: "medium"  # Options: tiny, base, small, medium, large
  use_fp16: False

input:
  simulation_mode_enabled: False
  # simulation_looping_enabled: True
  recording_enabled: False
  video_name: "recording_20260306_102521.mp4"

semantic_analyzer:
  urgency_model_path: "models/setfit_models/urgency_model"
  moe_model_path: "models/setfit_models/moe_model"
  urgency_threshold: 0.5
  urgency_setfit_train_dataset: training/setfit/urgentTrainSetFit.json
  moe_setfit_train_dataset: training/setfit/Moe_train_Setfit_v5.json